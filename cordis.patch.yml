# Keep llm-pi-ai mounted for its provider-owned OAuth flow, but let this plugin
# own the openai-codex route so its executable model set can refresh at runtime.
- id: llm-pi-ai
  config:
    providers: {}

- insert:
    - id: codex-subscription-oauth
      name: './lib/index.js'
      config:
        catalog:
          refreshIntervalMs: 900000
          revalidateAfterMs: 60000
          timeoutMs: 15000
